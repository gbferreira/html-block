<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>html-block — browser demo</title>
    <style>
      body {
        font-family: ui-sans-serif, system-ui, sans-serif;
        margin: 0;
        min-height: 100vh;
        background: #0f1115;
        color: #e7e9ee;
      }
      main {
        max-width: 48rem;
        margin: 0 auto;
        padding: 2rem 1.25rem 3rem;
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 600;
      }
      p {
        color: #9aa3b5;
        line-height: 1.5;
        margin-bottom: 1rem;
      }
      .panel {
        background: #171a21;
        border: 1px solid #2a3242;
        border-radius: 0.65rem;
        padding: 1rem 1.1rem;
        margin-top: 0.75rem;
      }
      code {
        font-family: ui-monospace, monospace;
        font-size: 0.85rem;
        color: #b8cad9;
      }
      .label {
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: #6b7589;
        margin-bottom: 0.5rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Browser demo (<code>dist/</code> build)</h1>
      <p>
        Imports the compiled library from <code>dist/index.js</code>. Run <code
          >npm run browser</code
        >
        to rebuild and open this page.
      </p>

      <div class="label">Rendered output</div>
      <div id="rendered" class="panel"></div>

      <div class="label" style="margin-top: 1.25rem">Source string</div>
      <div id="source" class="panel"><code>—</code></div>
    </main>

    <script type="module" src="/main.ts"></script>
  </body>
</html>
