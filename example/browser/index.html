<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>html-block — board demo</title>
    <style>
      :root {
        color-scheme: light;
      }
      html, body {
        height: 100%;
      }
      body {
        font-family: ui-sans-serif, system-ui, sans-serif;
        margin: 0;
        background: #f1f5f9;
        color: #0f172a;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }
      header.app-header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 16px;
        background: #ffffff;
        border-bottom: 1px solid #e2e8f0;
        flex-wrap: wrap;
      }
      header.app-header h1 {
        font-size: 14px;
        font-weight: 600;
        margin: 0;
        margin-right: auto;
      }
      header.app-header button {
        font: inherit;
        border: 1px solid #cbd5e1;
        background: #ffffff;
        border-radius: 6px;
        padding: 6px 10px;
        cursor: pointer;
      }
      header.app-header button:hover {
        background: #eff6ff;
        border-color: #93c5fd;
      }
      .hint {
        margin: 8px 16px 0;
        color: #64748b;
        font-size: 12px;
      }
      main {
        flex: 1;
        padding: 12px 16px 24px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .board-card {
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
        display: flex;
        flex-direction: column;
        height: 540px;
      }
      .board-card__header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-bottom: 1px solid #e2e8f0;
        background: #f8fafc;
        flex: 0 0 auto;
      }
      .board-card__title {
        font-size: 13px;
        font-weight: 600;
      }
      .board-card__actions {
        margin-left: auto;
        display: flex;
        gap: 6px;
      }
      .board-card__actions button {
        font: inherit;
        font-size: 12px;
        border: 1px solid #cbd5e1;
        background: #ffffff;
        border-radius: 6px;
        padding: 4px 8px;
        cursor: pointer;
      }
      .board-card__actions button:hover {
        background: #eff6ff;
      }
      /* The library mounts .hb-board inside the card; let it fill the card. */
      .board-card .hb-board {
        flex: 1 1 auto;
        height: auto;
        min-height: 0;
      }
    </style>
  </head>
  <body>
    <header class="app-header">
      <h1>html-block demo</h1>
      <button id="new-board" type="button">New board</button>
    </header>
    <p class="hint">
      Right-click on a board to add a rectangle. Click a block to edit font size
      or color. Double-click to edit text. Drag to move; drag a corner to
      resize. State is persisted to localStorage automatically.
    </p>
    <main id="boards"></main>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
