<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>html-block — tabbed demo</title>
    <style>
      :root {
        color-scheme: light;
      }
      html,
      body {
        height: 100%;
      }
      body {
        font-family: ui-sans-serif, system-ui, sans-serif;
        margin: 0;
        background: #f1f5f9;
        color: #0f172a;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }
      #root {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      header.app-header {
        padding: 12px 16px 10px;
        background: #ffffff;
        border-bottom: 1px solid #e2e8f0;
        flex: 0 0 auto;
      }
      header.app-header h1 {
        font-size: 14px;
        font-weight: 600;
        margin: 0;
      }
      .hint {
        margin: 6px 0 8px;
        color: #64748b;
        font-size: 12px;
        line-height: 1.45;
      }
      .toolbar {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .toolbar button {
        font: inherit;
        font-size: 12px;
        border: 1px solid #cbd5e1;
        background: #ffffff;
        border-radius: 6px;
        padding: 4px 10px;
        cursor: pointer;
      }
      .toolbar button:hover {
        background: #eff6ff;
      }
      .tabs {
        display: flex;
        align-items: flex-end;
        gap: 4px;
        padding: 0 16px;
        background: #ffffff;
        border-bottom: 1px solid #e2e8f0;
        flex: 0 0 auto;
        overflow-x: auto;
      }
      .tab {
        padding: 8px 14px;
        border: 1px solid #e2e8f0;
        border-bottom: none;
        background: #f8fafc;
        color: #475569;
        font: inherit;
        font-size: 13px;
        border-radius: 8px 8px 0 0;
        cursor: pointer;
        position: relative;
        top: 1px;
      }
      .tab:hover {
        background: #f1f5f9;
      }
      .tab.is-active {
        background: #ffffff;
        color: #0f172a;
        font-weight: 600;
      }
      .board-shell {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 0;
        padding: 12px 16px 16px;
      }
      .board-mount .hb-board {
        height: 100%;
        min-height: 360px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
