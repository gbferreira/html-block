<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>html-block — browser example</title>
    <style>
      :root {
        color-scheme: light;
      }
      html,
      body {
        height: 100%;
      }
      body {
        font-family: ui-sans-serif, system-ui, sans-serif;
        margin: 0;
        background: #f1f5f9;
        color: #0f172a;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }
      #root {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .app-shell {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .app-columns {
        flex: 1;
        display: flex;
        flex-direction: row;
        min-height: 0;
      }
      .app-main-column {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
      }
      header.app-header {
        padding: 12px 16px 10px;
        background: #ffffff;
        border-bottom: 1px solid #e2e8f0;
        flex: 0 0 auto;
      }
      header.app-header h1 {
        font-size: 14px;
        font-weight: 600;
        margin: 0;
      }
      .hint {
        margin: 6px 0 8px;
        color: #64748b;
        font-size: 12px;
        line-height: 1.45;
      }
      .toolbar {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .toolbar button {
        font: inherit;
        font-size: 12px;
        border: 1px solid #cbd5e1;
        background: #ffffff;
        border-radius: 6px;
        padding: 4px 10px;
        cursor: pointer;
      }
      .hint code {
        font-size: 11px;
        background: #f1f5f9;
        padding: 1px 4px;
        border-radius: 4px;
      }
      .board-shell {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 0;
        padding: 12px 16px 16px;
      }
      .board-mount .hb-board {
        height: 100%;
        min-height: 360px;
      }
      .board-sidebar {
        flex: 0 0 0;
        width: 0;
        opacity: 0;
        visibility: hidden;
        overflow: hidden;
        align-self: stretch;
        border-left: 1px solid transparent;
        background: #ffffff;
        display: flex;
        flex-direction: column;
        min-height: 0;
        transition:
          flex-basis 0.2s ease,
          opacity 0.18s ease,
          width 0.2s ease,
          visibility 0.2s;
      }
      .board-sidebar.is-visible {
        flex-basis: 260px;
        width: 260px;
        max-width: min(260px, 40vw);
        opacity: 1;
        visibility: visible;
        border-left-color: #e2e8f0;
      }
      .board-sidebar-header {
        padding: 10px 12px;
        font-size: 12px;
        font-weight: 600;
        border-bottom: 1px solid #e2e8f0;
        flex: 0 0 auto;
        color: #334155;
      }
      .board-sidebar-list {
        list-style: none;
        margin: 0;
        padding: 8px;
        overflow: auto;
        flex: 1;
        min-height: 0;
      }
      .board-sidebar-item {
        display: block;
        width: 100%;
        text-align: left;
        font: inherit;
        font-size: 13px;
        padding: 8px 10px;
        border: 1px solid transparent;
        border-radius: 6px;
        background: transparent;
        color: #475569;
        cursor: pointer;
      }
      .board-sidebar-item:hover {
        background: #f8fafc;
      }
      .board-sidebar-item.is-active {
        background: #eff6ff;
        border-color: #bfdbfe;
        color: #0f172a;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
